repos:
  - repo: https://github.com/pycqa/isort
    rev: '6.0.1'
    hooks:
      - id: isort
        name: isort (python)

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black

  - repo: https://github.com/pycqa/flake8
    rev: '7.2.0'
    hooks:
      - id: flake8

  - repo: local
    hooks:
      - id: bandit
        name: bandit
        entry: bandit -c pyproject.toml -r .
        language: system
        types: [python]

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        args: []

  - repo: local
    hooks:
      - id: check-commit-msg
        name: Commit message style checker
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
