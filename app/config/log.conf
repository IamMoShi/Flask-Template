# log.conf
[loggers]
keys=root, gunicorn.error, gunicorn.access, sqlalchemy

[handlers]
keys=console, error_file, access_file, sqlalchemy_file

[formatters]
keys=generic, access

[logger_root]
level=INFO
handlers=console

[logger_gunicorn.error]
level=INFO
handlers=error_file
propagate=1
qualname=gunicorn.error

[logger_gunicorn.access]
level=INFO
handlers=access_file
propagate=0
qualname=gunicorn.access

[logger_sqlalchemy]
level=INFO
handlers=sqlalchemy_file
qualname=sqlalchemy.engine
propagate=0

[handler_console]
class=StreamHandler
formatter=generic
args=(sys.stdout,)

[handler_error_file]
class=logging.handlers.TimedRotatingFileHandler
formatter=generic
args=('logs/gunicorn-error.log', 'midnight', 1, 30, 'utf-8')

[handler_access_file]
class=logging.handlers.TimedRotatingFileHandler
formatter=access
args=('logs/gunicorn-access.log', 'midnight', 1, 7, 'utf-8')

[handler_sqlalchemy_file]
class=logging.handlers.TimedRotatingFileHandler
formatter=generic
args=('logs/sqlalchemy.log', 'midnight', 1, 30, 'utf-8')

[formatter_generic]
format=[%(asctime)s] [%(process)d] %(levelname)s %(name)s: %(message)s

[formatter_access]
format=%(message)s
